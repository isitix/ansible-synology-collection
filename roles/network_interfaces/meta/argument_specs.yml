---
argument_specs:
  main:
    short_description: "Configure a network interface"
    options:
      action:
        type: str
        description: "Action to perform (list or configure)"
        choices: [ list, configure ]
      interface:
        type: dict
        options:
          iface:
            type: str
            description: "Interface name (e.g. eth0)"
          dhcp:
            type: bool
            default: false
            description: "Use DHCP if true; otherwise static"
          ip:
            type: str
            description: "IPv4 address when dhcp is false"
          mask:
            type: str
            description: "Netmask when dhcp is false"