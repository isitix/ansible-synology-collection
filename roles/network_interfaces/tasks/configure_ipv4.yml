---
- name: Configure DHCP
  ansible.builtin.command: synonet --dhcp {{ interface.iface }}
  when: interface.dhcp
  changed_when: true

- name: Configure static ip
  ansible.builtin.command: >
    synonet --manual {{ interface.iface }} static {{ interface.ip }}
    {{ interface.mask }}
  when: not interface.dhcp
  changed_when: true