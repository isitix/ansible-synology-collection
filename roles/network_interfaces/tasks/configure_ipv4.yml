---
- name: Configure DHCP
  ansible.builtin.command: /usr/syno/sbin/synonet --dhcp {{ interface.iface }}
  when: interface.dhcp
  changed_when: true

- name: Configure static ip
  ansible.builtin.command: >
    /usr/syno/sbin/synonet --manual {{ interface.iface }} {{ interface.ip }}
    {{ interface.mask }}
  when: not interface.dhcp
  changed_when: true